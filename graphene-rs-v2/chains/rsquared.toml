[chain]
name = "rsquared"
core_root = "../../chains/rsquared/R-Squared-core"

[openrpc]
header_roots = [
  "libraries/protocol",
  "libraries/chain",
  "libraries/app",
  "libraries/wallet",
  "libraries/plugins",
]

[[surfaces]]
name = "rsquared"
api_header = "libraries/app/include/graphene/app/database_api.hpp"
api_qualified_name = "graphene::app::database_api"
excluded_methods = [
  "set_subscribe_callback",
  "set_pending_transaction_callback",
  "set_block_applied_callback",
  "subscribe_to_market",
]
output = "../target/generated/rsquared/spec.json"
schema_output = "../target/generated/rsquared/schema.json"
variants_rs = "../crates/graphene-chain-rsquared/src/generated/variants.rs"
variants_names = "../crates/graphene-chain-rsquared/src/generated/variants.names"
types_rs = "../crates/graphene-chain-rsquared/src/generated/types.rs"
rpc_rs = "../crates/graphene-chain-rsquared/src/generated/rpc.rs"
schema_title = "rsquared_types_root"
