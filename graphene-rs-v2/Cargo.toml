[workspace]
members = [
    "crates/graphene-chain-acta",
    "crates/graphene-chain-bitshares",
    "crates/graphene-chain-rsquared",
    "crates/graphene-chain-swaplock",
    "crates/graphene-codegen",
    "crates/graphene-codec",
    "crates/open-graphene-gen",
    "crates/graphene-rpc",
    "crates/graphene-signing",
    "crates/graphene-transaction",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
graphene-chain-swaplock = { path = "crates/graphene-chain-swaplock" }
graphene-codec = { path = "crates/graphene-codec" }
graphene-rpc = { path = "crates/graphene-rpc" }
graphene-signing = { path = "crates/graphene-signing" }
graphene-transaction = { path = "crates/graphene-transaction" }
prettyplease = "0.2"
regress = "0.10"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
secp256k1 = { version = "0.29", features = ["recovery"] }
syn = { version = "2", features = ["full", "parsing"] }
toml = "0.8"
tungstenite = { version = "0.24", features = ["native-tls"] }
typify = "0.4"
ureq = { version = "2", features = ["json"] }
