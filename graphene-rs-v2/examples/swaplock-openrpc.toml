# Example config for running the generic OpenRPC pipeline against Swaplock.
# Relative output paths are resolved from this file's directory.

[chain]
name = "swaplock"
core_root = "/Users/lunacrafts/workspaces/mirrorboards/boards/boards-swaplock/swaplock-core"

[openrpc]
wallet_header = "libraries/wallet/include/graphene/wallet/wallet.hpp"
output = "../target/generated/swaplock/spec.json"
header_roots = [
  "libraries/protocol",
  "libraries/chain",
  "libraries/app",
  "libraries/wallet",
  "libraries/plugins",
]

[rust]
schema_output = "../target/generated/swaplock/schema.json"
variants_rs = "../target/generated/swaplock/variants.rs"
variants_names = "../target/generated/swaplock/variants.names"
types_rs = "../target/generated/swaplock/types.rs"
types_preview = "../target/generated/swaplock/types.preview.rs"
schema_title = "swaplock_types_root"
