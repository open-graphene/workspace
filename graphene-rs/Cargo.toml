[workspace]
members = [
    "crates/graphene-codec",
    "crates/graphene-rpc",
    "crates/graphene-signing",
    "crates/graphene-transaction",
    "crates/graphene-bindings-swaplock",
    "crates/graphene-bindings-acta",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
graphene-codec = { path = "crates/graphene-codec" }
graphene-rpc = { path = "crates/graphene-rpc" }
graphene-signing = { path = "crates/graphene-signing" }
graphene-transaction = { path = "crates/graphene-transaction" }
regress = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
secp256k1 = { version = "0.29", features = ["recovery"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
ureq = { version = "2", features = ["json"] }
