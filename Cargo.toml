[workspace]
members = [
    "crates/open-graphene-gen",
    "crates/graphene-chain-swaplock",
    "crates/graphene-codec",
    "crates/graphene-rpc",
    "crates/graphene-signing",
    "crates/graphene-transaction",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
graphene-chain-swaplock = { path = "crates/graphene-chain-swaplock" }
graphene-codec = { path = "crates/graphene-codec" }
graphene-rpc = { path = "crates/graphene-rpc" }
graphene-signing = { path = "crates/graphene-signing" }
graphene-transaction = { path = "crates/graphene-transaction" }
bs58 = "0.5"
chrono = "0.4"
regress = "0.10"
schemars = "0.8"
secp256k1 = { version = "0.29", features = ["rand-std", "recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.24", features = ["native-tls"] }
ureq = { version = "2", default-features = false, features = ["json"] }
