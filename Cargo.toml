[workspace]
members = [
    "graphene/crates/graphene-gen-bindings-rs",
    "graphene/crates/graphene-gen-spec",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }
toml = "0.8"
typify = "0.4"
