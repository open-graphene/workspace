[chain]
name = "swaplock"
core_root = "../../chains/swaplock/swaplock-core"

[open_graphene]
header_roots = [
  "libraries/protocol",
  "libraries/chain",
  "libraries/app",
  "libraries/wallet",
  "libraries/plugins",
]

[[networks]]
name = "mainnet"
label = "Swaplock Mainnet"
default = true
chain_id = "2267f694d96b7ffdcba1a98c63c09e720a18a85ad34954e299c66d5a42234098"
address_prefix = "BTS"

[[networks.endpoints]]
url = "wss://node01.swaplock.chainpool.online:8090"
transport = "websocket"
label = "Chainpool node 01"
priority = 100

[[networks.endpoints]]
url = "wss://node02.swaplock.chainpool.online:8090"
transport = "websocket"
label = "Chainpool node 02"
priority = 90

[[networks]]
name = "testnet"
label = "Swaplock Testnet"

[[surfaces]]
name = "swaplock-database"
kind = "database"
api_name = "database"
api_header = "libraries/app/include/graphene/app/database_api.hpp"
api_qualified_name = "graphene::app::database_api"
excluded_methods = [
  "set_subscribe_callback",
  "set_pending_transaction_callback",
  "set_block_applied_callback",
  "subscribe_to_market",
]
output = "../specs/swaplock/api.database.json"

[[surfaces]]
name = "swaplock-broadcast"
kind = "broadcast"
api_name = "network_broadcast"
api_header = "libraries/app/include/graphene/app/api.hpp"
api_qualified_name = "graphene::app::network_broadcast_api"
excluded_methods = [
  "broadcast_transaction_with_callback",
]
output = "../specs/swaplock/api.network-broadcast.json"
