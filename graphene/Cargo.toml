[workspace]
members = [
    "crates/graphene-spec-gen",
    "crates/graphene-gen-ts",
    "crates/graphene-gen-dart",
    "crates/graphene-gen-rust",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
graphene-bindings-swaplock = { path = "../graphene-rs/crates/graphene-bindings-swaplock" }
graphene-codec = { path = "../graphene-rs/crates/graphene-codec" }
graphene-rpc = { path = "../graphene-rs/crates/graphene-rpc" }
graphene-signing = { path = "../graphene-rs/crates/graphene-signing" }
graphene-transaction = { path = "../graphene-rs/crates/graphene-transaction" }
prettyplease = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }
typify = "0.4"
